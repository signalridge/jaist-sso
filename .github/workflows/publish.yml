name: Version or publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: changesets-main
  queue: max
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm install --global npm@11.19.1
      - run: bun install --frozen-lockfile
      - name: Select current main or a merged release transition
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          transition="$(bun scripts/publish-changesets.ts --classify)"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || [ "$transition" = true ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.select.outputs.eligible == 'true'
        run: bun run check
      - name: Recheck main immediately before Changesets writes
        id: recheck
        if: steps.select.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          transition="$(bun scripts/publish-changesets.ts --classify)"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || [ "$transition" = true ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create version PR or publish
        id: changesets
        if: steps.recheck.outputs.eligible == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          github-token: ${{ github.token }}
          version: bun run version-packages
          publish: bun run publish-packages
          title: "chore(release): version package"
          commit: "chore(release): version package"
          commitMode: github-api
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: "true"
      # PR events created by GITHUB_TOKEN do not start CI. workflow_dispatch is
      # explicitly allowed and validates the generated branch without a PAT.
      - name: Validate generated version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          pr_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" --jq '.head.sha')"
          gh workflow run ci.yml --ref changeset-release/main
          # GitHub can also hold bot-created PR runs for approval. Only approve
          # this workflow's own same-repository release PR at its current SHA.
          for attempt in 1 2 3 4 5 6; do
            echo "Waiting for generated PR checks ($attempt/6)"
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&per_page=20" | jq -r --arg sha "$pr_sha" --argjson pr "$RELEASE_PR" '.workflow_runs[] | select(.head_sha == $sha and .head_branch == "changeset-release/main" and .actor.login == "github-actions[bot]" and .conclusion == "action_required" and any(.pull_requests[]; .number == $pr and .head.repo.id != null and .head.repo.id == .base.repo.id)) | .id')"
            if [ -n "$runs" ]; then
              while IFS= read -r run_id; do
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
              done <<< "$runs"
              break
            fi
            sleep 5
          done
